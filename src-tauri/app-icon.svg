<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17171f"/>
      <stop offset="1" stop-color="#06060c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="46%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark studio tile -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- white brand chip (mirrors the in-app logo) -->
  <rect x="300" y="250" width="424" height="424" rx="104" fill="#ffffff"/>
  <!-- black "L" monogram -->
  <path d="M 432 342 L 432 590 L 606 590" fill="none" stroke="#06060c"
        stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- three descending lyric ticks -->
  <g fill="#ffffff">
    <rect x="356" y="736" width="312" height="22" rx="11" opacity="0.9"/>
    <rect x="392" y="792" width="240" height="22" rx="11" opacity="0.5"/>
    <rect x="424" y="848" width="176" height="22" rx="11" opacity="0.28"/>
  </g>
</svg>
