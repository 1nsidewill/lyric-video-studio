[package]
name = "app"
version = "0.4.1"
description = "the rest — local-first toolkit for underground artists (beats, lyric videos)"
authors = ["insidewill"]
license = "MIT"
repository = "https://github.com/1nsidewill/lyric-video-studio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# yt-dlp binary fetch (already in the tree via the updater plugin)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
