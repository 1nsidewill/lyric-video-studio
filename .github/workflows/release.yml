name: release

# Build native desktop bundles for Windows + macOS and attach them to a GitHub Release.
# Trigger by pushing a version tag (e.g. `git tag v0.2.0 && git push --tags`),
# or run manually from the Actions tab (workflow_dispatch) to smoke-test a build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # needed to create/upload the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-13        # Intel
            target: x86_64-apple-darwin
          - os: windows-latest  # x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Provision bundled FFmpeg sidecar
        run: npm run fetch-ffmpeg

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key pair for the auto-updater. Set these as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # On a tag push, create/append to a draft release; on manual runs, just build.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Lyric Video Studio ${{ github.ref_name }}'
          releaseDraft: true
          releaseBody: |
            ### Downloads
            - **Windows:** `.msi` or `.exe` (NSIS) installer
            - **macOS (Apple Silicon):** `*_aarch64.dmg`
            - **macOS (Intel):** `*_x64.dmg`

            FFmpeg is bundled inside the app — no separate install needed.

      # On manual (non-tag) runs there is no release to attach to, so keep the raw bundles.
      - name: Upload build artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: lyric-video-studio-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: ignore
